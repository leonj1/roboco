name: Labeler

on: [pull_request_target]

jobs:
  label:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
